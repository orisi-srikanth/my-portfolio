<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c070a"/>
      <stop offset="50%" stop-color="#180b12"/>
      <stop offset="100%" stop-color="#0a0508"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee2a5b"/>
      <stop offset="100%" stop-color="#c4123f"/>
    </linearGradient>
    <filter id="glowStar" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <circle cx="250" cy="360" r="320" fill="#e61c4d" opacity="0.1" filter="url(#glowStar)"/>

  <!-- Main Container Grid (Two Cards matching exact screenshot) -->
  <g transform="translate(140, 100)">
    
    <!-- LEFT CARD: Chatly Info -->
    <g transform="translate(0, 0)">
      <rect width="480" height="520" rx="24" fill="#131017" stroke="#2b222d" stroke-width="1.5"/>
      
      <!-- Red Star Icon Badge -->
      <g transform="translate(48, 48)">
        <rect width="64" height="64" rx="18" fill="url(#brandGrad)"/>
        <!-- Star Symbol -->
        <path d="M 32 16 L 35 27 L 46 30 L 35 33 L 32 44 L 29 33 L 18 30 L 29 27 Z" fill="#ffffff"/>
      </g>
      
      <!-- Title & Description -->
      <text x="240" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle">Chatly</text>
      <text x="240" y="250" fill="#a49fa5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">Smart chat interface with authentication, memory-ready history,</text>
      <text x="240" y="275" fill="#a49fa5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">tool display, and modern AI-style UI.</text>
      
      <!-- 2x2 Feature Pills -->
      <!-- Pill 1 -->
      <g transform="translate(36, 320)">
        <rect width="196" height="64" rx="14" fill="#1b1722" stroke="#2d2635" stroke-width="1"/>
        <text x="24" y="38" font-size="18">🔒</text>
        <text x="52" y="38" fill="#e2dee4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Secure login system</text>
      </g>
      
      <!-- Pill 2 -->
      <g transform="translate(248, 320)">
        <rect width="196" height="64" rx="14" fill="#1b1722" stroke="#2d2635" stroke-width="1"/>
        <text x="20" y="38" font-size="18">🧠</text>
        <text x="48" y="38" fill="#e2dee4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Memory-ready chat flow</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(36, 404)">
        <rect width="196" height="64" rx="14" fill="#1b1722" stroke="#2d2635" stroke-width="1"/>
        <text x="24" y="38" font-size="18">⚒️</text>
        <text x="52" y="38" fill="#e2dee4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Tool-aware agent UI</text>
      </g>
      
      <!-- Pill 4 -->
      <g transform="translate(248, 404)">
        <rect width="196" height="64" rx="14" fill="#1b1722" stroke="#2d2635" stroke-width="1"/>
        <text x="24" y="38" font-size="18">⚡</text>
        <text x="52" y="38" fill="#e2dee4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Clean modern experience</text>
      </g>
    </g>

    <!-- RIGHT CARD: Login Form -->
    <g transform="translate(520, 0)">
      <rect width="480" height="520" rx="24" fill="#131017" stroke="#2b222d" stroke-width="1.5"/>
      
      <!-- Tab Switcher -->
      <g transform="translate(36, 48)">
        <rect width="408" height="54" rx="14" fill="#18141f"/>
        <!-- Active Tab: Login -->
        <rect x="4" y="4" width="198" height="46" rx="10" fill="url(#brandGrad)"/>
        <text x="103" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Login</text>
        <!-- Inactive Tab: Register -->
        <text x="305" y="32" fill="#7a757e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Register</text>
      </g>
      
      <!-- Form Title -->
      <text x="240" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" text-anchor="middle">Welcome back</text>
      <text x="240" y="195" fill="#8e8992" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">Login to continue using Chatly.</text>
      
      <!-- Inputs -->
      <!-- Username Input -->
      <g transform="translate(36, 230)">
        <rect width="408" height="56" rx="12" fill="#18141f" stroke="#29222e" stroke-width="1"/>
        <text x="20" y="34" fill="#58525c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Username</text>
      </g>
      
      <!-- Password Input -->
      <g transform="translate(36, 304)">
        <rect width="408" height="56" rx="12" fill="#18141f" stroke="#29222e" stroke-width="1"/>
        <text x="20" y="34" fill="#58525c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Password</text>
      </g>
      
      <!-- Submit Button -->
      <g transform="translate(36, 385)">
        <rect width="408" height="56" rx="14" fill="url(#brandGrad)"/>
        <text x="204" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Login</text>
      </g>
      
      <!-- Forgot Password Link -->
      <text x="240" y="475" fill="#ee2a5b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Forgot Password?</text>
    </g>

  </g>
</svg>
