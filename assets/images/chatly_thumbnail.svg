<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bubbleAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Glowing Orbs -->
  <circle cx="200" cy="120" r="150" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="650" cy="380" r="180" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Chat Window Mockup -->
  <g transform="translate(100, 40)">
    <!-- Window Outer Shell -->
    <rect width="600" height="420" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 584 0 A 16 16 0 0 1 600 16 L 600 50 L 0 50 Z" fill="rgba(15, 23, 42, 0.8)"/>
    <line x1="0" y1="50" x2="600" y2="50" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="25" cy="25" r="6" fill="#ef4444"/>
    <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="25" r="6" fill="#10b981"/>
    
    <!-- Title / AI Status -->
    <text x="300" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Chatly AI Assistant</text>
    <circle cx="385" cy="26" r="4" fill="#10b981"/>

    <!-- Chat Messages Container -->
    <!-- AI Message 1 -->
    <g transform="translate(30, 80)">
      <rect width="40" height="40" rx="12" fill="url(#accentGrad)"/>
      <!-- Sparkle Icon -->
      <path d="M 50 20 M 20 10 L 22 17 L 29 19 L 22 21 L 20 28 L 18 21 L 11 19 L 18 17 Z" fill="#ffffff" transform="translate(0, 0)"/>
      <rect x="52" y="0" width="340" height="55" rx="14" fill="url(#bubbleAi)" stroke="rgba(255,255,255,0.08)"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Hello! I am Chatly AI. How can I help you today?</text>
      <text x="70" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ask me anything about code, writing, or analysis!</text>
    </g>

    <!-- User Message 1 -->
    <g transform="translate(180, 160)">
      <rect width="390" height="48" rx="14" fill="url(#bubbleUser)"/>
      <text x="20" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Can you analyze market trends &amp; summarize the data?</text>
    </g>

    <!-- AI Message 2 (Typing/Response) -->
    <g transform="translate(30, 230)">
      <rect width="40" height="40" rx="12" fill="url(#accentGrad)"/>
      <path d="M 50 20 M 20 10 L 22 17 L 29 19 L 22 21 L 20 28 L 18 21 L 11 19 L 18 17 Z" fill="#ffffff"/>
      <rect x="52" y="0" width="460" height="95" rx="14" fill="url(#bubbleAi)" stroke="rgba(255,255,255,0.08)"/>
      <text x="70" y="26" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚡ Chatly AI Insights:</text>
      <text x="70" y="48" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">1. Sales growth increased by 24% month-over-month.</text>
      <text x="70" y="68" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">2. Customer engagement is highest in AI automation tools.</text>
      <text x="70" y="85" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">✓ Real-time analysis completed in 0.4s</text>
    </g>

    <!-- Bottom Input Bar -->
    <g transform="translate(30, 350)">
      <rect width="540" height="48" rx="24" fill="#0f172a" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
      <text x="25" y="29" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Type your prompt here...</text>
      <!-- Send Button -->
      <circle cx="510" cy="24" r="18" fill="url(#accentGrad)"/>
      <path d="M 504 24 L 514 18 L 510 28 L 507 24 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
