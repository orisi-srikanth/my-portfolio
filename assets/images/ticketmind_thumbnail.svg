<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 78.75 1000 562.5" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c19"/>
      <stop offset="50%" stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>

    <!-- Brand Accent Gradient (Indigo-Violet-Purple) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glowStar" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <circle cx="250" cy="360" r="320" fill="#6366f1" opacity="0.12" filter="url(#glowStar)"/>
  <circle cx="1000" cy="360" r="320" fill="#a855f7" opacity="0.1" filter="url(#glowStar)"/>

  <!-- Main Container Grid (Two Cards matching Chatly ratio exactly) -->
  <g transform="translate(140, 100)">
    
    <!-- LEFT CARD: TicketMind Info -->
    <g transform="translate(0, 0)">
      <rect width="480" height="520" rx="24" fill="#111625" stroke="#232f48" stroke-width="1.5"/>
      
      <!-- Purple Lightning Icon Badge -->
      <g transform="translate(48, 48)">
        <rect width="64" height="64" rx="18" fill="url(#brandGrad)"/>
        <!-- Lightning Symbol -->
        <path d="M 35 16 L 21 35 L 32 35 L 27 50 L 43 31 L 32 31 Z" fill="#ffffff"/>
      </g>
      
      <!-- Title & Description -->
      <text x="240" y="205" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" text-anchor="middle">TicketMind AI</text>
      <text x="240" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">AI-powered support ticket classifier for category,</text>
      <text x="240" y="270" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">priority scoring, sentiment, &amp; auto-responses.</text>
      
      <!-- 2x2 Feature Pills -->
      <!-- Pill 1 -->
      <g transform="translate(36, 315)">
        <rect width="196" height="64" rx="14" fill="#192238" stroke="#2a3a5c" stroke-width="1"/>
        <text x="22" y="38" font-size="18">🏷️</text>
        <text x="50" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Category Detection</text>
      </g>
      
      <!-- Pill 2 -->
      <g transform="translate(248, 315)">
        <rect width="196" height="64" rx="14" fill="#192238" stroke="#2a3a5c" stroke-width="1"/>
        <text x="22" y="38" font-size="18">🔥</text>
        <text x="50" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Priority Scoring</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(36, 395)">
        <rect width="196" height="64" rx="14" fill="#192238" stroke="#2a3a5c" stroke-width="1"/>
        <text x="22" y="38" font-size="18">💬</text>
        <text x="50" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Sentiment Analysis</text>
      </g>
      
      <!-- Pill 4 -->
      <g transform="translate(248, 395)">
        <rect width="196" height="64" rx="14" fill="#192238" stroke="#2a3a5c" stroke-width="1"/>
        <text x="22" y="38" font-size="18">⚡</text>
        <text x="50" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Auto Response</text>
      </g>
    </g>

    <!-- RIGHT CARD: Ticket Interface Mockup -->
    <g transform="translate(520, 0)">
      <rect width="480" height="520" rx="24" fill="#111625" stroke="#232f48" stroke-width="1.5"/>
      
      <!-- Form Title -->
      <text x="240" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" text-anchor="middle">Support Ticket</text>
      <text x="240" y="98" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">Paste customer complaint to classify</text>
      
      <!-- Textarea Mockup -->
      <g transform="translate(36, 122)">
        <rect width="408" height="175" rx="14" fill="#0b0e17" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="34" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CUSTOMER COMPLAINT</text>
        <text x="20" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Payment failed but money was deducted from</text>
        <text x="20" y="88" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">my account. Need urgent help!</text>
        
        <!-- Sample pills row inside textarea -->
        <g transform="translate(20, 122)">
          <rect width="80" height="28" rx="6" fill="#192238"/>
          <text x="40" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sample 1</text>
          
          <rect x="90" y="0" width="80" height="28" rx="6" fill="#192238"/>
          <text x="130" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sample 2</text>
          
          <rect x="180" y="0" width="80" height="28" rx="6" fill="#192238"/>
          <text x="220" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sample 3</text>
        </g>
      </g>
      
      <!-- Primary Analyze Button -->
      <g transform="translate(36, 316)">
        <rect width="408" height="54" rx="14" fill="url(#brandGrad)"/>
        <text x="204" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Analyze Ticket  ✦</text>
      </g>
      
      <!-- AI Result Box -->
      <g transform="translate(36, 388)">
        <rect width="408" height="82" rx="14" fill="#192238" stroke="#2b3b5e" stroke-width="1"/>
        <text x="20" y="32" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">HIGH PRIORITY  •  PAYMENTS DEPT</text>
        <text x="20" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Sentiment: Urgent / Frustrated (-0.85)</text>
      </g>
    </g>

  </g>
</svg>
